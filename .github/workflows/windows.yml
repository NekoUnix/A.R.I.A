name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Camera dependency compatibility
        run: |
          python -m pip install --dry-run --ignore-installed --only-binary=:all: -r tracking/requirements-lock.txt
      - name: Camera adapter conversion tests
        run: python -m unittest discover -s tracking -v
      - name: Build portable Windows app
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipTests
      - name: Upload app and instructions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-windows-x64
          path: dist/aria-0.33.0-alpha.1-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
