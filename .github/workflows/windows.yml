name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Streamer.bot connector C# and HTTP regressions
        run: python scripts/test-streamerbot.py
      - name: Rust-only runtime and release-content checks
        run: |
          python scripts/check-runtime-distribution.py
          python scripts/test-runtime-distribution.py
      - name: Camera dependency compatibility
        run: |
          python -m pip install --dry-run --ignore-installed --only-binary=:all: -r tracking/requirements-lock.txt
      - name: Camera adapter conversion tests
        run: python -m unittest discover -s tracking -v
      - name: Build portable Windows app
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipTests
      - name: Upload app and instructions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aria-windows-x64
          path: dist/aria-0.37.0-alpha.1-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
