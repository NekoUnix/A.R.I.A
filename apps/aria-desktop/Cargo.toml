[package]
name = "aria-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "aria-desktop"
path = "src/main.rs"

[features]
screenshots = []

[dependencies]
aria-core.workspace = true
aria-tracking.workspace = true
aria-model.workspace = true
aria-live2d.workspace = true
bytemuck = { version = "1", features = ["derive"] }

serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
eframe = { version = "=0.33.0", default-features = false, features = ["default_fonts", "wgpu", "persistence", "x11", "wayland"] }
wgpu = { version = "27.0.1", default-features = false, features = ["std", "dx12", "vulkan", "wgsl"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Graphics_Dxgi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
pollster = "0.4"
tempfile = "3"
